<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 730" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="730" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">Shelly 2PM Gen3 — podłączenie rolety (tryb cover, 230 V~)</text>

  <!-- ===================== SIEĆ 230 V~ ===================== -->
  <rect x="20" y="120" width="160" height="180" rx="10" fill="#f4f6f8" stroke="#9aa5b1"/>
  <text x="38" y="150" font-size="15" font-weight="bold" fill="#111">Sieć 230 V~</text>
  <text x="38" y="172" font-size="12" fill="#555">(przez zabezpieczenie</text>
  <text x="38" y="188" font-size="12" fill="#555">B/C 16 A, klasa 3)</text>
  <text x="150" y="145" font-size="13" fill="#7a5c00" font-weight="bold">L</text>
  <text x="150" y="205" font-size="13" fill="#14508c" font-weight="bold">N</text>
  <text x="140" y="265" font-size="13" fill="#2e7d32" font-weight="bold">PE</text>

  <!-- ===================== PRZYCISKI ŚCIENNE ===================== -->
  <rect x="500" y="470" width="70" height="46" rx="6" fill="#eef2f7" stroke="#9aa5b1"/>
  <circle cx="535" cy="492" r="4" fill="#666"/>
  <text x="470" y="545" font-size="13" fill="#333">przycisk GÓRA</text>
  <rect x="550" y="470" width="0" height="0" fill="none"/>
  <rect x="605" y="470" width="70" height="46" rx="6" fill="#eef2f7" stroke="#9aa5b1"/>
  <circle cx="640" cy="492" r="4" fill="#666"/>
  <text x="580" y="545" font-size="13" fill="#333">przycisk DÓŁ</text>
  <text x="468" y="565" font-size="11" fill="#777">(monostabilne, do L)</text>
  <text x="578" y="565" font-size="11" fill="#777">(monostabilne, do L)</text>

  <!-- ===================== SHELLY ===================== -->
  <rect x="260" y="80" width="440" height="290" rx="14" fill="#eaf3ea" stroke="#4a7d4a" stroke-width="2"/>
  <text x="292" y="120" font-size="18" font-weight="bold" fill="#1b5e20">Shelly 2PM Gen3</text>
  <text x="292" y="144" font-size="13" fill="#33691e">tryb: roleta / cover</text>
  <text x="292" y="164" font-size="12" fill="#666">S3SW-002P16EU · ESP32-C3 · 2×10 A</text>

  <!-- zaciski górne: O1 L L O2 (N) -->
  <g fill="#c8e6c9" stroke="#4a7d4a">
    <rect x="322" y="342" width="16" height="16"/>
    <rect x="372" y="342" width="16" height="16"/>
    <rect x="422" y="342" width="16" height="16"/>
    <rect x="472" y="342" width="16" height="16"/>
    <rect x="562" y="342" width="16" height="16"/>
    <rect x="612" y="342" width="16" height="16"/>
    <rect x="652" y="342" width="16" height="16"/>
  </g>
  <text x="318" y="334" font-size="13" font-weight="bold" fill="#111">O1</text>
  <text x="372" y="334" font-size="13" font-weight="bold" fill="#111">L</text>
  <text x="422" y="334" font-size="13" font-weight="bold" fill="#111">L</text>
  <text x="472" y="334" font-size="13" font-weight="bold" fill="#111">O2</text>
  <text x="556" y="334" font-size="13" font-weight="bold" fill="#111">S1</text>
  <text x="606" y="334" font-size="13" font-weight="bold" fill="#111">S2</text>
  <text x="648" y="334" font-size="13" font-weight="bold" fill="#111">N</text>
  <text x="290" y="316" font-size="11" fill="#777">kolejność zacisków na obudowie: O1 · L · L · O2 · S1 · S2 · N</text>

  <!-- ===================== SILNIK ===================== -->
  <rect x="770" y="120" width="190" height="200" rx="12" fill="#fdf2e3" stroke="#c98b2d"/>
  <text x="790" y="152" font-size="15" font-weight="bold" fill="#7a4a00">Silnik rolety</text>
  <text x="790" y="172" font-size="11" fill="#7a5c00">z wyłącznikami</text>
  <text x="790" y="187" font-size="11" fill="#7a5c00">krańcowymi (wymagane!)</text>
  <g fill="#ffe0b2" stroke="#c98b2d">
    <rect x="762" y="142" width="16" height="16"/>
    <rect x="762" y="182" width="16" height="16"/>
    <rect x="762" y="222" width="16" height="16"/>
  </g>
  <text x="790" y="232" font-size="13" fill="#111">N</text>
  <text x="790" y="156" font-size="13" fill="#111">L1 (góra)</text>
  <text x="790" y="196" font-size="13" fill="#111">L2 (dół)</text>

  <!-- ===================== PRZEWODY ===================== -->
  <!-- L z sieci: do zacisku L (2. od lewej) oraz szyna do przycisków -->
  <polyline points="180,150 210,150 210,44 392,44 392,342" fill="none" stroke="#7a5c00" stroke-width="2.5"/>
  <polyline points="210,150 210,640 680,640" fill="none" stroke="#7a5c00" stroke-width="2.5"/>
  <circle cx="210" cy="150" r="4" fill="#7a5c00"/>
  <circle cx="570" cy="640" r="4" fill="#7a5c00"/>
  <circle cx="630" cy="640" r="4" fill="#7a5c00"/>

  <!-- N z sieci: do zacisku N + odgałęzienie do silnika -->
  <polyline points="180,210 232,210 232,62 700,62 700,230 762,230" fill="none" stroke="#14508c" stroke-width="2.5"/>
  <polyline points="660,62 660,342" fill="none" stroke="#14508c" stroke-width="2.5"/>
  <circle cx="660" cy="62" r="4" fill="#14508c"/>

  <!-- O1 -> L1 silnika -->
  <polyline points="330,342 330,26 726,26 726,142 762,142" fill="none" stroke="#e67e22" stroke-width="3"/>
  <!-- O2 -> L2 silnika -->
  <polyline points="480,342 480,10 746,10 746,182 762,182" fill="none" stroke="#8e44ad" stroke-width="3"/>

  <!-- S1/S2 -> przyciski -> szyna L -->
  <polyline points="570,342 570,470" fill="none" stroke="#5d6d7e" stroke-width="2.5"/>
  <polyline points="630,342 630,470" fill="none" stroke="#5d6d7e" stroke-width="2.5"/>
  <polyline points="570,516 570,640" fill="none" stroke="#7a5c00" stroke-width="2.5"/>
  <polyline points="630,516 630,640" fill="none" stroke="#7a5c00" stroke-width="2.5"/>

  <!-- PE (tylko instalacja / silnik) -->
  <polyline points="180,270 205,270" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="96" y="300" font-size="11" fill="#2e7d32">PE tylko do instalacji/silnika — Shelly nie ma zacisku PE</text>

  <!-- ===================== LEGENDA / UWAGI ===================== -->
  <line x1="20" y1="660" x2="60" y2="660" stroke="#7a5c00" stroke-width="2.5"/>
  <text x="66" y="664" font-size="12" fill="#333">L (faza)</text>
  <line x1="150" y1="660" x2="190" y2="660" stroke="#14508c" stroke-width="2.5"/>
  <text x="196" y="664" font-size="12" fill="#333">N (neutralny)</text>
  <line x1="300" y1="660" x2="340" y2="660" stroke="#e67e22" stroke-width="3"/>
  <text x="346" y="664" font-size="12" fill="#333">O1 → L1 (kierunek 1)</text>
  <line x1="490" y1="660" x2="530" y2="660" stroke="#8e44ad" stroke-width="3"/>
  <text x="536" y="664" font-size="12" fill="#333">O2 → L2 (kierunek 2)</text>
  <line x1="680" y1="660" x2="720" y2="660" stroke="#5d6d7e" stroke-width="2.5"/>
  <text x="726" y="664" font-size="12" fill="#333">S1/S2</text>

  <text x="20" y="690" font-size="12" fill="#b00020" font-weight="bold">UWAGA:</text>
  <text x="86" y="690" font-size="12" fill="#333">prace przy 230 V wykonuj po odłączeniu zasilania; silnik rolety podłączaj tylko z poprawnie ustawionymi</text>
  <text x="20" y="706" font-size="12" fill="#333">wyłącznikami krańcowymi; maks. obciążenie: 10 A na kanał / 16 A łącznie.</text>
</svg>
